# Blitz: test every change, then redeploy to Cloudflare automatically (main branch).
# One-time setup in GitHub → Settings → Secrets and variables → Actions:
#   CLOUDFLARE_API_TOKEN       (Cloudflare → My Profile → API Tokens → "Edit Cloudflare Workers" template)
#   CLOUDFLARE_ACCOUNT_ID      (Cloudflare dashboard → Workers & Pages → Account ID)
#   SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY, APP_PASSWORD
name: Blitz

on:
  push:
    branches: [main, "claude/**"]
    paths: ["apps/blitz/**", ".github/workflows/blitz.yml"]
  workflow_dispatch:

concurrency:
  group: blitz-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: apps/blitz

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/blitz/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npx wrangler types cloudflare/worker-configuration.d.ts && npx tsc -p cloudflare/tsconfig.json
      - run: npm test
      - run: npm run build

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/blitz/package-lock.json
      - run: npm ci
      - name: Check Cloudflare secrets
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CF_TOKEN" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN is not set; skipping deploy. See the comment at the top of .github/workflows/blitz.yml."
            echo "SKIP=1" >> "$GITHUB_ENV"
          fi
      - name: Deploy to Cloudflare
        if: env.SKIP != '1'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/blitz
          wranglerVersion: "4.151.0"
          command: deploy
          secrets: |
            SUPABASE_URL
            SUPABASE_SERVICE_ROLE_KEY
            APP_PASSWORD
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
